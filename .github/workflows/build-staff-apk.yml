name: Build staff Android APK

on:
  push:
    branches:
      - codex/android-apk-build-20260822

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/BrownberriesAttendance
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrownberriesAttendance
          path: android/BrownberriesAttendance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
